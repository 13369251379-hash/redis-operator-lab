# ============================================================
# redis 密码 Secret —— GitOps 管理版本（第二阶段）
# 说明：operator 通过 CR 的 redisSecret.name/key 引用本 Secret。
#       stringData 明文便于阅读；生产环境应改用 SOPS/SealedSecret/
#       外部 secret 管理器，勿把真实密码提交 git（本实验室密码仅用于本地）。
# 与手动版差异：原 `kubectl create secret generic` 创建的 redis-secret
#       现在由 Argo CD App(redis-replication) 接管。
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: redis-op-lab
type: Opaque
stringData:
  redis-password: LabRedis2026
